// Связь игрового сервера с базой сайта.
//
// Отсюда admin_sql.amxx берёт список администраторов. Запрос он делает ровно
// один: SELECT auth, password, access, flags FROM <amx_sql_table>. Никаких
// условий в нём нет — просроченные записи отсекает само представление в базе.
//
// ⚠️ amx_sql_table указывает на ПРЕДСТАВЛЕНИЕ `zm_admins`, а не на таблицу с
// привилегиями. В нём уже отфильтровано по сроку. Направите на zm_privileges —
// и просроченные привилегии продолжат работать вечно.
//
// Имя не `admins` (принятое по умолчанию) намеренно: в базе этого аккаунта
// таблица `admins` уже занята соседним сайтом.
//
// ⚠️ Пользователь здесь должен иметь ТОЛЬКО право SELECT на это представление.
// Файл лежит на игровом хостинге, где его видит больше людей, чем вам хотелось
// бы, а пароль сайта открывает всю базу с заказами и игровыми паролями.
//
// *NOTE* На Linux вместо "localhost" всегда указывайте адрес: с "localhost"
// клиент MySQL пытается идти через файл-сокет, которого на другой машине нет.

amx_sql_host    "95.213.255.80"
amx_sql_user    "ЗАПОЛНИТЬ_только_select"
amx_sql_pass    "ЗАПОЛНИТЬ"
amx_sql_db      "ЗАПОЛНИТЬ"
amx_sql_table   "zm_admins"
amx_sql_type    "mysql"

// Ждать ответа базы дольше нескольких секунд нельзя: этот запрос выполняется
// при запуске карты, и всё это время сервер стоит.
amx_sql_timeout "5"
