# ═══════════════════════════════════════════════════════════════════════════
#   ReUnion — опознание игроков без лицензии Steam
# ═══════════════════════════════════════════════════════════════════════════
#
# Этот файл собран из родного reunion.cfg версии 0.2.0.25: набор настроек тот
# же, изменены и объяснены только те, что для нас важны. Родной лежит в
# upstream/common/reunion-0.2.0.25.zip — с ним и сверяйтесь при обновлении.
#
# ⚠️ ЗАЧЕМ ЭТО ВООБЩЕ НУЖНО. Кредиты, ножи, облики и класс сервер сохраняет по
# ключу, который выдаёт zm_db_key() (custom/include/zm_db.inc): настоящий
# SteamID, а если его нет — «ник:Имя». Ник занять может кто угодно, поэтому
# всё, что сохранено по нику, достанется первому, кто под этим ником зайдёт.
# ReUnion и нужен затем, чтобы у игрока без лицензии тоже был SteamID и ветка
# «по нику» не срабатывала.
#
# ⚠️ СОЛЬ СЮДА НЕ ПИШЕТСЯ. Строка SteamIdHashSalt внизу оставлена пустой
# намеренно: её подставляет tools/assemble.mjs из custom/reunion-salt.txt,
# которого нет в репозитории. Причины две — она секрет, и она у каждой
# установки своя.


# ═══ ОПОЗНАНИЕ ═════════════════════════════════════════════════════════════
#
# Что значат числа (из родного конфига):
#   1 — настоящий или вычисленный по «железу» STEAM_xx:xx:xx
#   2 — то же, но VALVE_xx:xx:xx
#   3 — STEAM_ ПО АДРЕСУ (по IP)
#   4 — VALVE_ по адресу
#   5 — не пускать
#   7 — HLTV
#   8..12 — служебные (LAN, PENDING и прочее)

# Лицензия Steam — настоящий идентификатор от Valve. Трогать нечего.
cid_Steam = 1

# Клиент опознался, но полезного идентификатора не дал (бывает STEAM_0:0:0).
# Не пускаем: такой игрок неотличим от любого другого такого же.
cid_SteamPending = 5

# HLTV (запись трансляций). Не нужен — не пускаем.
cid_HLTV = 5

# Старые клиенты, не умеющие выдавать уникальный идентификатор вовсе.
cid_NoSteam47 = 5
cid_NoSteam48 = 5

# Эмуляторы, которые умеют выдавать «железный» идентификатор. Все на 1 —
# сервер вычислит им устойчивый SteamID и посолит его (см. SteamIdHashSalt).
cid_RevEmu = 1
cid_RevEmu2013 = 1
cid_SC2009 = 1
cid_OldRevEmu = 1
cid_SteamEmu = 1
cid_AVSMP = 1
cid_SXEI = 1

# ⚠️ SETTI: В РОДНОМ КОНФИГЕ ЗДЕСЬ СТОИТ 3, ТО ЕСТЬ «ПО IP». МЫ ПОСТАВИЛИ 1,
# И ЭТО СОЗНАТЕЛЬНОЕ ОТСТУПЛЕНИЕ ОТ УМОЛЧАНИЯ.
#
# Опознание по адресу ломается двумя способами сразу, и оба видны игрокам:
#   * двое из одной квартиры или из-под одного провайдерского NAT получают
#     ОДИН И ТОТ ЖЕ идентификатор — то есть общие кредиты, ножи и облики, а с
#     IDClientsLimit ниже второй ещё и не сможет зайти;
#   * у игрока с меняющимся адресом идентификатор меняется вместе с ним, и он
#     теряет всё накопленное на ровном месте.
#
# Для сервера, который хранит прогресс, это негодно. Setti-клиент свой
# идентификатор выдаёт — в разделе префиксов у него есть собственный
# Setti_Prefix1, а он существует именно для ВЫЧИСЛЯЕМЫХ идентификаторов.
#
# ⚠️ ЧТО ПРОВЕРИТЬ ПОСЛЕ ЗАПУСКА: включите LoggingMode ниже и посмотрите в
# журнале, какие SteamID получают Setti-игроки. Если у всех окажется один и
# тот же — значит клиент идентификатора не даёт, и надо вернуть 3 (общие
# кредиты у соседей по адресу) либо поставить 5 (не пускать вовсе). Решение
# за владельцем: 3 — это неудобство, 5 — это потерянные игроки.
cid_Setti = 1


# ═══ НАСТРОЙКИ ОПОЗНАНИЯ ═══════════════════════════════════════════════════

# Версия правил вычисления идентификаторов. 3 — нынешняя, её и держим.
# ⚠️ Менять нельзя после запуска: у ВСЕХ игроков без лицензии сменятся
# SteamID, и весь сохранённый прогресс станет им чужим.
AuthVersion = 3

# ⚠️ ЗДЕСЬ ПУСТО НАРОЧНО — соль подставляет сборка, см. шапку файла.
#
# Что она делает (из родной документации): «Salt string for SteamIDs hashing.
# Irreversibly changes SteamIDs. Prevents SteamID stealing.» То есть именно
# соль и мешает принести чужой SteamID со стороны: сервер считает свой
# собственный, зная секрет, которого нет ни у кого другого.
#
# ⚠️ Соль нельзя менять после запуска по той же причине, что и AuthVersion.
# Длина — от 16 знаков, рекомендуется 32 и больше; сборка делает 48.
SteamIdHashSalt =

# Совместимость идентификаторов SC2009 с revEmu. При AuthVersion 3 включено
# всегда, значение оставлено для наглядности.
SC2009_RevCompatMode = 1

# Вычисление идентификаторов по данным клиента sXe Injected. Включать ТОЛЬКО
# при установленном сервере sXe — у нас его нет.
EnableSXEIdGeneration = 0

# Второй префикс у вычисленных идентификаторов: снижает вероятность совпадений.
# При AuthVersion 3 включён всегда.
EnableGenPrefix2 = 0

# С этого адреса HLTV пустят, даже когда cid_HLTV = 5.
HLTVExcept_IP = 127.0.0.1


# ═══ ПРЕФИКСЫ ══════════════════════════════════════════════════════════════
#
# Весь раздел не действует при AuthVersion больше 2, то есть у нас. Оставлен
# как есть, чтобы файл совпадал с родным по составу.

IPGen_Prefix1 = 0
IPGen_Prefix2 = 4
Native_Prefix1 = 0;
RevEmu_Prefix1 = 1;
RevEmu2013_Prefix1 = 1;
SC2009_Prefix1 = 1;
OldRevEmu_Prefix1 = 2;
SteamEmu_Prefix1 = 3;
AVSMP_Prefix1 = 4;
Setti_Prefix1 = 5;
SXEI_Prefix1 = 6;


# ═══ ОТВЕТЫ НА ЗАПРОСЫ ═════════════════════════════════════════════════════

# Как отвечать мониторингам. 0 — как обычный сервер.
ServerInfoAnswerType = 0

# Чинит испорченные запросы, на которых сервер иначе спотыкается.
FixBuggedQuery = 1

# ⚠️ ОГРАНИЧИТЕЛЬ ЗАПРОСОВ — ЭТО ЗАЩИТА, А НЕ УДОБСТВО. Без него сервер
# заваливают запросами состояния, и он перестаёт отвечать живым игрокам.
EnableQueryLimiter = 1
QueryFloodBanLevel = 400
QueryFloodBanTime = 10

[QueryLimiterExceptIP]

# Разбивать длинные ответы на части. Часть мониторингов такого не понимает.
AllowSplitPackets = 0

# ⚠️ Сколько подключений допускается с ОДНОГО идентификатора. Единица не даёт
# одному человеку занять несколько мест и фармить кредиты вторым окном.
#
# Держится это на том, что идентификаторы у разных людей разные, — то есть
# на настройке cid_Setti выше. Вернёте её на 3 («по адресу») — поставьте
# здесь 2, иначе двое из одной квартиры не смогут играть вместе: у них будет
# один идентификатор на двоих.
IDClientsLimit = 1


# ═══ ПРОЧЕЕ ════════════════════════════════════════════════════════════════

# Журнал: 0 — молчать, 1 — в консоль, 2 — в файлы, 3 — и туда и туда.
#
# ⚠️ Поставлено 2, а не 0, НАРОЧНО. Без журнала не проверить главное — какие
# идентификаторы на самом деле получают игроки без лицензии. Проверить это
# надо в первые же дни (см. предупреждение у cid_Setti), а потом можно и
# выключить: файл растёт.
LoggingMode = 2
