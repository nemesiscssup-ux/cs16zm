// Настройки этой установки. Файл подставляется в конец server.cfg при сборке,
// поэтому переживает пересборку — в отличие от правок в самом server.cfg.

// FastDL: раздача файлов обычным веб-сервером вместо встроенной закачки
// GoldSrc (та идёт около 20 КБ/с, наши 28 МБ качались бы минут пятнадцать).
// Дерево готовится командой  node tools/build-fastdl.mjs
// и заливается    tools/upload-fastdl.sh
//
// В конце адреса ИМЕННО /cstrike и без косой черты: клиент дописывает к нему
// путь вида /models/....
//
// ⚠️ Домен сменился 12 августа 2026 (было pw792.castledev.ru). Старое имя лишь
// перенаправляет на новое, а клиент GoldSource перенаправления НЕ понимает:
// оставите прежний адрес — раздача молча выключится, и все двести мегабайт
// поедут встроенной закачкой по 20 КБ/с. И именно http, без буквы s: TLS
// движок тоже не умеет.
//
// ⏳ 12 августа 2026: РАЗДАЧА С ВЕБ-ХОСТИНГА УДАЛЕНА по решению владельца —
// она будет жить на игровом хостинге. Дерево занимало около 260 МБ, место на
// диске сайта освобождено. Прежний адрес http://zm.hotcs.ru/cstrike больше не
// отвечает, поэтому строка ниже и стоит пустой: пустая раздача честнее, чем
// адрес, ведущий в никуда.
//
// ⚠️ ПЕРЕД ЗАПУСКОМ СЕРВЕРА СЮДА НАДО ВПИСАТЬ АДРЕС РАЗДАЧИ ИГРОВОГО ХОСТИНГА.
// Пустая строка означает встроенную закачку GoldSource: двести мегабайт по
// 20 КБ/с — это часы, и новичок просто уйдёт. Ошибки он не увидит, игра молча
// пустит его без моделей, так что заметить это можно только по тому, что людей
// нет. Проверять — заходом с чистого клиента, а не глазами по конфигу.
//
// Дерево для заливки собирается командой  node tools/build-fastdl.mjs
// и лежит в dist/fastdl — заливать туда, куда скажет игровой хостинг.
sv_downloadurl ""

// Оставляем включённой: если файла на сайте не окажется, клиент тихо вернётся
// к медленной встроенной закачке, и игра не сломается.
sv_allowdownload 1

// Отдавать файлы игрокам мы не хотим ни при каких обстоятельствах.
sv_allowupload 0
